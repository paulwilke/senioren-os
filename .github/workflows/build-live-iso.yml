name: Build live ISO (try out + data rescue)

# Start by hand. Result: senioren-os-live.iso as a download on the run.
on:
  workflow_dispatch:

jobs:
  live-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build live image
        run: |
          sudo podman build --pull=newer \
            --cap-add sys_admin --security-opt label=disable --squash \
            --build-arg BASE=ghcr.io/${{ github.repository_owner }}/senioren-os:latest \
            -t localhost/senioren-os-live:latest live/

      - name: Create live ISO
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/senioren-os-live:latest

      - name: Rename and checksum
        run: |
          mkdir -p out
          mv "${{ steps.iso.outputs.iso-dest }}" out/senioren-os-live.iso
          (cd out && sha256sum senioren-os-live.iso | tee senioren-os-live.iso.sha256)
          ls -lh out

      - name: Upload for download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: senioren-os-live-iso
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
