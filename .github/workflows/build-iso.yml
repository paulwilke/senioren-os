name: Build installation ISO

# Start by hand (Actions → "Build installation ISO" → Run workflow).
# The result is then available as a download ("artifact") on the workflow run.
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/senioren-os:latest

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./iso/config.toml
          image: ${{ env.IMAGE }}
          types: anaconda-iso
          rootfs: btrfs
          chown: 1001:1001
          additional-args: --use-librepo=True

      - name: Upload ISO for download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: senioren-os-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
