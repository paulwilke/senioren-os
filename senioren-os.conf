# Senioren-OS: language and keyboard of the system and the apps.
# Change, commit, push: the next build applies it. Machines get it with their next update.
# Note: the default bookmark titles and the few messages shown to the user are written in German.

# Language of the desktop, Firefox, Thunderbird and spell checking (e.g. de, en, fr, es, it, nl)
LANGUAGE=de

# System locale (date, numbers, currency). The installer may set its own for each machine.
LOCALE=de_DE.UTF-8

# Keyboard layout as GNOME/xkb names it (e.g. de+mac, de, us, fr+mac, es)
KEYBOARD=de+mac
