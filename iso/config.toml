# Installation ISO (bootc-image-builder, type "anaconda-iso").
# The installer only asks for language, users (name + password) and disk.
# Afterwards the installed system fetches its updates from the registry.

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Users",
]

[customizations.installer.kickstart]
contents = """
# Keep the firewall as the image ships it (otherwise Anaconda opens SSH)
firewall --use-system-defaults
%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/paulwilke/senioren-os:latest
%end
"""
