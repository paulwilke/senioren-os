      <stop offset="0.45" stop-color="#a9b9e0"/>
      <stop offset="0.72" stop-color="#f3c7b4"/>
      <stop offset="1" stop-color="#f8dcc0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffe7c7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd9b0" stop-opacity="0"/>
