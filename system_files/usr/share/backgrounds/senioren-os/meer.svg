  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f74b5"/>
      <stop offset="0.5" stop-color="#8fb3dc"/>
      <stop offset="0.85" stop-color="#f2d2b8"/>
      <stop offset="1" stop-color="#fbe3c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
