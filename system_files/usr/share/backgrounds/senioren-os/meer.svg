<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2880 1800" preserveAspectRatio="xMidYMid slice">
  <!-- Senioren-OS wallpaper "Meer" (own work, Apache-2.0): the Mediterranean on a clear day -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fd6"/>
      <stop offset="0.7" stop-color="#9fc8ec"/>
      <stop offset="1" stop-color="#d7eaf7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f78b8"/>
      <stop offset="0.25" stop-color="#1f6aa8"/>
      <stop offset="0.7" stop-color="#1a8aa8"/>
      <stop offset="1" stop-color="#2aa6ad"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cloud" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="2880" height="1800" fill="url(#sky)"/>

  <!-- a few soft clouds -->
  <g fill="#ffffff" filter="url(#cloud)">
    <ellipse cx="560" cy="330" rx="260" ry="55" opacity="0.55"/>
    <ellipse cx="760" cy="300" rx="180" ry="45" opacity="0.45"/>
    <ellipse cx="2150" cy="420" rx="300" ry="50" opacity="0.45"/>
    <ellipse cx="2380" cy="390" rx="170" ry="40" opacity="0.4"/>
    <ellipse cx="1500" cy="640" rx="380" ry="35" opacity="0.35"/>
  </g>

  <!-- sea -->
  <rect y="1000" width="2880" height="800" fill="url(#sea)"/>
  <rect y="1000" width="2880" height="260" fill="url(#shine)"/>
  <line x1="0" y1="1000" x2="2880" y2="1000" stroke="#cfe6f6" stroke-width="3" opacity="0.6"/>

  <!-- gentle waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path stroke-opacity="0.25" stroke-width="3" d="M220 1050 q 50 -8 100 0 M760 1065 q 60 -10 120 0 M1380 1045 q 50 -8 100 0 M1960 1070 q 60 -10 120 0 M2560 1055 q 50 -8 100 0"/>
    <path stroke-opacity="0.22" stroke-width="5" d="M90 1170 q 100 -16 200 0 M640 1205 q 110 -18 220 0 M1240 1180 q 100 -16 200 0 M1840 1215 q 120 -20 240 0 M2420 1185 q 110 -18 220 0"/>
    <path stroke-opacity="0.18" stroke-width="7" d="M300 1370 q 160 -26 320 0 M1060 1410 q 170 -28 340 0 M1820 1375 q 160 -26 320 0 M2500 1420 q 150 -24 300 0"/>
    <path stroke-opacity="0.15" stroke-width="9" d="M40 1610 q 220 -34 440 0 M900 1660 q 240 -38 480 0 M1860 1620 q 230 -36 460 0"/>
  </g>
</svg>
