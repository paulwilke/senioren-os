      <stop offset="0.35" stop-color="#3f78b0"/>
      <stop offset="1" stop-color="#1c4778"/>
    </linearGradient>
    <linearGradient id="reflex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2dc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff2dc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="coast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9cc6"/><stop offset="1" stop-color="#7c8dbd"/>
    </linearGradient>
  </defs>

